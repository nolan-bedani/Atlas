---
# ══════════════════════════════════════════════
# proxmox_network — Sous-interfaces VLAN (passerelles)
# ══════════════════════════════════════════════

# ─── Déploiement des sous-interfaces vmbr0.20 / .30 / .90 ───
- name: "Déployer la configuration des sous-interfaces VLAN Atlas"
  ansible.builtin.template:
    src: atlas-vlans.cfg.j2
    dest: /etc/network/interfaces.d/atlas-vlans.cfg
    owner: root
    group: root
    mode: "0644"
  notify: Recharger la configuration réseau

# ─── Debug ───
- name: "Debug — VLANs configurés"
  ansible.builtin.debug:
    var: proxmox_network_vlans
  when: proxmox_network_debug
