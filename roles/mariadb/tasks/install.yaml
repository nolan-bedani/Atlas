---
# ══════════════════════════════════════════════
# Rôle : mariadb — installation des paquets
# ══════════════════════════════════════════════

# ─── Installation de MariaDB ───
- name: Installer le serveur et le client MariaDB
  ansible.builtin.apt:
    name:
      - mariadb-server
      - mariadb-client
    state: present
    update_cache: true
    cache_valid_time: 3600

# ─── Activation du service ───
- name: Activer et démarrer le service mariadb
  ansible.builtin.service:
    name: mariadb
    enabled: true
    state: started
