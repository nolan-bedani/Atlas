---
# ══════════════════════════════════════════════
# Rôle : proxmox_provision — création d'un conteneur LXC unitaire
# ══════════════════════════════════════════════

# ─── Création du conteneur (idempotent : state present) ───

# Authentification : jeton API si défini (vault_proxmox_token_*),
# sinon repli sur le mot de passe (vault_proxmox_password).
- name: "Créer le conteneur LXC {{ conteneur.hostname }} (VMID {{ conteneur.vmid }})"
  community.general.proxmox:
    api_host: "{{ vault_proxmox_host }}"
    api_user: "{{ vault_proxmox_user }}"
    api_token_id: "{{ vault_proxmox_token_id | default(omit) }}"
    api_token_secret: "{{ vault_proxmox_token_secret | default(omit) }}"
    api_password: "{{ vault_proxmox_password | default(omit) }}"
    validate_certs: false
    node: "{{ ansible_hostname }}"
    vmid: "{{ conteneur.vmid }}"
    hostname: "{{ conteneur.hostname }}"
    ostemplate: "local:vztmpl/debian-12-standard_12.12-1_amd64.tar.zst"
    # Format « storage:taille » (storage local imposé, jamais local-lvm).
    # NB : disk_volume est buggué dans community.general 9.5 (400 API),
    # et storage+disk séparés sont mutuellement exclusifs — testé sur PVE 8.4.
    disk: "local:{{ conteneur.disk }}"
    cores: "{{ conteneur.cores }}"
    memory: "{{ conteneur.memory }}"
    netif: '{"net0":"name=eth0,bridge=vmbr0,ip={{ conteneur.ip }}/24,gw={{ conteneur.gw }},tag={{ conteneur.vlan }}"}'
    pubkey: "{{ proxmox_provision_ssh_pubkey }}"
    tags: "atlas"
    description: "Projet Atlas PRA/DR | Role: {{ conteneur.role }} | Managed by Ansible"
    unprivileged: true
    # keyctl retiré : l'API Proxmox n'autorise que nesting via jeton API
    # (keyctl exige une session root@pam et ne sert qu'à Docker imbriqué)
    features: "nesting=1"
    onboot: true
    state: present
