---
# ══════════════════════════════════════════════
# Rôle : proxmox_provision — démarrage des conteneurs LXC
# ══════════════════════════════════════════════

# ─── Démarrage des conteneurs (idempotent : state started) ───

# Authentification : jeton API si défini (vault_proxmox_token_*),
# sinon repli sur le mot de passe (vault_proxmox_password).
- name: Démarrer les conteneurs LXC du projet Atlas
  community.general.proxmox:
    api_host: "{{ vault_proxmox_host }}"
    api_user: "{{ vault_proxmox_user }}"
    api_token_id: "{{ vault_proxmox_token_id | default(omit) }}"
    api_token_secret: "{{ vault_proxmox_token_secret | default(omit) }}"
    api_password: "{{ vault_proxmox_password | default(omit) }}"
    validate_certs: "{{ proxmox_validate_certs }}"
    vmid: "{{ conteneur.vmid }}"
    hostname: "{{ conteneur.hostname }}"
    state: started
  loop: "{{ proxmox_containers }}"
  loop_control:
    loop_var: conteneur
    label: "{{ conteneur.hostname }}"
