---
# ══════════════════════════════════════════════════════════════════════
# Rôle : backup — planification cron des sauvegardes
# ══════════════════════════════════════════════════════════════════════

# ─── Collecte des dumps + binlogs hors site (RPO <= 20 min) ───
# Fréquence pilotée par backup_collect_interval_min (15 min par défaut) pour
# tenir l'objectif RPO. Une exécution unique quotidienne donnait un RPO ~24 h.
- name: "Planifier la collecte des dumps/binlogs MariaDB (RPO)"
  ansible.builtin.cron:
    name: "Collecte dumps+binlogs MariaDB RPO"
    user: root
    minute: "*/{{ backup_collect_interval_min }}"
    job: "{{ backup_scripts_dir }}/collect_dumps.sh"
    state: present

- name: "Planifier la sauvegarde du filestore GLPI à 03h00"
  ansible.builtin.cron:
    name: "Sauvegarde filestore GLPI 03h00"
    user: root
    minute: "0"
    hour: "3"
    job: "{{ backup_scripts_dir }}/backup_filestore.sh"
    state: present

# ─── Diagnostic (mode debug) ───
- name: "Afficher la planification cron"
  ansible.builtin.debug:
    msg: "Cron : collect_dumps.sh toutes les {{ backup_collect_interval_min }} min, backup_filestore.sh à 03h00 (utilisateur root)"
  when: backup_debug | bool
