# ─── Mise à jour APT (éviter un dist-upgrade à chaque exécution) ───
# 'safe' : mises à jour sans changement majeur. 'dist' ponctuellement pour une
# montée de version complète (noyau, etc.).
common_apt_upgrade: "safe"

# ─── NTP (plusieurs serveurs + repli) ───
common_ntp_servers:
  - "0.debian.pool.ntp.org"
  - "1.debian.pool.ntp.org"
  - "2.debian.pool.ntp.org"
common_ntp_fallback:
  - "pool.ntp.org"

# ─── Services pilotables par atlsvc via sudo (moindre privilège, pas de joker) ───
common_sudo_allowed_services:
  - nginx
  - "php8.2-fpm"
  - mariadb
  - zabbix-server
  - zabbix-agent2
  - grafana-server
  - postfix

# ─── Mode debug ───
common_debug: false
