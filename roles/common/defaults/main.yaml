common_ssh_pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICGExy+C98JHFxEVLa3pi7P3EGdCDLHcsmKYpIldns2j atladm@atlas"

# ─── Domaine interne Atlas ───
common_atlas_domain: "atlas.local"

# ─── Sources autorisées pour SSH (bastion + passerelles de l'hyperviseur) ───
common_ssh_admin_sources:
  - "10.90.0.0/24"
  - "10.20.0.1"
  - "10.30.0.1"

# ─── Inventaire des conteneurs LXC Atlas ───
common_atlas_hosts:
  - { name: atlbst01p,  ip: 10.90.0.10 }
  - { name: atlrp01p,   ip: 10.20.0.10 }
  - { name: atlapp01p,  ip: 10.20.0.11 }
  - { name: atldb01p,   ip: 10.30.0.10 }
  - { name: atlsmtp01p, ip: 10.30.0.11 }
