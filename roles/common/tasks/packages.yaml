---
# ══════════════════════════════════════════════
# Rôle : common — gestion des paquets de base
# ══════════════════════════════════════════════

# ─── Mise à jour du système ───

# 'safe' par défaut : pas de dist-upgrade systématique (changements de noyau /
# paquets majeurs à chaque run). Passer common_apt_upgrade=dist ponctuellement.
- name: Mettre à jour le cache APT et appliquer les mises à jour de sécurité
  ansible.builtin.apt:
    update_cache: true
    upgrade: "{{ common_apt_upgrade }}"
    cache_valid_time: 3600

# ─── Installation des paquets essentiels ───

- name: Installer les paquets de base
  ansible.builtin.apt:
    name:
      - curl
      - vim
      - htop
      - ca-certificates
      - gnupg
      - python3-apt
      - ufw
      - sudo            # absent du template LXC debian-12-standard
    state: present

# ─── Suppression des paquets non sécurisés ───

- name: Supprimer les paquets obsolètes et non sécurisés
  ansible.builtin.apt:
    name:
      - telnet
      - rsh-client
    state: absent
    purge: true
