---
# ══════════════════════════════════════════════
# Rôle : common — fuseau horaire et synchronisation NTP
# ══════════════════════════════════════════════

# ─── Fuseau horaire ───

- name: Définir le fuseau horaire sur Europe/Paris
  community.general.timezone:
    name: Europe/Paris

# ─── Installation de systemd-timesyncd ───

- name: S'assurer que systemd-timesyncd est installé
  ansible.builtin.apt:
    name: systemd-timesyncd
    state: present

# ─── Configuration de la synchronisation NTP ───

- name: Déployer la configuration timesyncd
  ansible.builtin.template:
    src: timesyncd.conf.j2
    dest: /etc/systemd/timesyncd.conf
    owner: root
    group: root
    mode: "0644"
  notify: Redémarrer systemd-timesyncd

# ─── Activation du service ───

- name: Démarrer et activer systemd-timesyncd
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    state: started
    enabled: true
