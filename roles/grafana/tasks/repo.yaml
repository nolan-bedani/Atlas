---
# ══════════════════════════════════════════════
# Rôle : grafana — dépôt officiel Grafana
# ══════════════════════════════════════════════

# ─── Répertoire des clés de dépôt ───

- name: Créer le répertoire /etc/apt/keyrings
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

# ─── Clé GPG du dépôt Grafana ───

- name: Télécharger la clé GPG du dépôt Grafana
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /tmp/grafana.gpg.key
    mode: "0644"

# La directive creates garantit l'idempotence de la conversion
- name: Convertir la clé GPG au format binaire (dearmor)
  ansible.builtin.shell: gpg --dearmor < /tmp/grafana.gpg.key > /etc/apt/keyrings/grafana.gpg
  args:
    creates: /etc/apt/keyrings/grafana.gpg

# ─── Déclaration du dépôt APT ───

- name: Déclarer le dépôt APT Grafana
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://apt.grafana.com stable main"
    filename: grafana
    state: present
    update_cache: true
