---
# ══════════════════════════════════════════════
# Rôle : grafana — configuration et provisioning
# ══════════════════════════════════════════════

# ─── Configuration principale de Grafana ───

- name: Déployer la configuration principale de Grafana
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: /etc/grafana/grafana.ini
    owner: root
    group: grafana
    mode: "0640"
  no_log: true
  notify: Redémarrer grafana

# ─── Répertoires de provisioning ───

- name: Garantir la présence des répertoires de provisioning
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: grafana
    mode: "0750"
  loop:
    - /etc/grafana/provisioning/plugins
    - /etc/grafana/provisioning/datasources
    - /etc/grafana/provisioning/dashboards

- name: Garantir le répertoire des dashboards Atlas
  ansible.builtin.file:
    path: /var/lib/grafana/dashboards
    state: directory
    owner: grafana
    group: grafana
    mode: "0750"

# ─── Provisioning du plugin Zabbix ───

- name: Déployer le provisioning du plugin Zabbix
  ansible.builtin.template:
    src: provisioning_plugins.yaml.j2
    dest: /etc/grafana/provisioning/plugins/zabbix.yaml
    owner: root
    group: grafana
    mode: "0640"
  notify: Redémarrer grafana

# ─── Provisioning de la source de données Zabbix ───

- name: Déployer le provisioning de la source de données Zabbix
  ansible.builtin.template:
    src: provisioning_datasource.yaml.j2
    dest: /etc/grafana/provisioning/datasources/zabbix.yaml
    owner: root
    group: grafana
    mode: "0640"
  no_log: true
  notify: Redémarrer grafana

# ─── Provisioning des dashboards Atlas ───

- name: Déployer le provider de dashboards Atlas
  ansible.builtin.template:
    src: provisioning_dashboards.yaml.j2
    dest: /etc/grafana/provisioning/dashboards/atlas.yaml
    owner: root
    group: grafana
    mode: "0640"
  notify: Redémarrer grafana

- name: Déployer le dashboard « Atlas — Vue d'ensemble »
  ansible.builtin.template:
    src: dashboard_atlas.json.j2
    dest: /var/lib/grafana/dashboards/atlas_overview.json
    owner: grafana
    group: grafana
    mode: "0640"
  # Le provider relit le répertoire toutes les 30 s : pas de redémarrage requis

# ─── Pare-feu UFW ───

- name: Autoriser l'accès à Grafana depuis les réseaux Atlas
  community.general.ufw:
    rule: allow
    port: "{{ grafana_port }}"
    proto: tcp
    from_ip: "{{ item }}"
  loop:
    - "10.30.0.0/24"
    - "10.90.0.0/24"
