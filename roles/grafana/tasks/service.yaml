---
# ══════════════════════════════════════════════
# Rôle : grafana — activation du service
# ══════════════════════════════════════════════

# ─── Démarrage et activation du service ───

- name: Démarrer et activer le service grafana-server
  ansible.builtin.systemd_service:
    name: grafana-server
    state: started
    enabled: true
    daemon_reload: true

# Appliquer immédiatement les éventuels redémarrages en attente
- name: Vider la file des handlers
  ansible.builtin.meta: flush_handlers

# ─── Vérification de l'état de santé ───

- name: Vérifier que l'API de santé Grafana répond
  ansible.builtin.uri:
    url: "http://localhost:{{ grafana_port }}/api/health"
    status_code: 200
  register: grafana_health_check
  until: grafana_health_check.status == 200
  # Le redémarrage peut dépasser 60 s sur un conteneur à 512 Mo
  retries: 12
  delay: 10

# ─── Débogage ───

- name: Afficher un résumé de la configuration Grafana
  ansible.builtin.debug:
    msg: >-
      Grafana : http://atlgrf01p.atlas.local:{{ grafana_port }}/ —
      Source de données Zabbix : http://{{ grafana_zabbix_host }}:{{ grafana_zabbix_port }}/api_jsonrpc.php
  when: grafana_debug
