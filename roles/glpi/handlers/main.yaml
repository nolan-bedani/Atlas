---
# ══════════════════════════════════════════════
# Rôle : glpi — handlers
# ══════════════════════════════════════════════

# ─── Services PHP-FPM et nginx ───

- name: Redémarrer php8.2-fpm
  ansible.builtin.service:
    name: php8.2-fpm
    state: restarted

- name: Recharger nginx (glpi)
  ansible.builtin.service:
    name: nginx
    state: reloaded
