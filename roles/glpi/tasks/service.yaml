---
# ══════════════════════════════════════════════
# Rôle : glpi — gestion des services et vérification
# ══════════════════════════════════════════════

# ─── Activation et démarrage des services ───

- name: Activer et démarrer php8.2-fpm
  ansible.builtin.systemd_service:
    name: php8.2-fpm
    enabled: true
    state: started

- name: Activer et démarrer nginx
  ansible.builtin.systemd_service:
    name: nginx
    enabled: true
    state: started

# ─── Application immédiate des handlers en attente ───

- name: Vider la file des handlers
  ansible.builtin.meta: flush_handlers

# ─── Vérification HTTP de l'application ───

- name: Vérifier que GLPI répond en HTTP
  ansible.builtin.uri:
    url: "http://10.20.0.11/"
    status_code: [200, 302]
  register: glpi_http_check
  retries: 3
  delay: 5
  until: glpi_http_check is succeeded

# ─── Affichage de débogage ───

- name: Afficher le résultat de la vérification HTTP
  ansible.builtin.debug:
    var: glpi_http_check
  when: glpi_debug
