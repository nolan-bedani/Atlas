---
# ══════════════════════════════════════════════
# Rôle : zabbix — variables par défaut
# ══════════════════════════════════════════════

# ─── Version et dépôt Zabbix ───

zabbix_version: "7.0"
zabbix_release_deb_url: "https://repo.zabbix.com/zabbix/7.0/debian/pool/main/z/zabbix-release/zabbix-release_latest_7.0+debian12_all.deb"

# ─── Réseau et base de données ───

# Adresse IP du serveur Zabbix (atlzbx01p)
zabbix_server_ip: "10.30.0.12"
# Adresse IP du serveur MariaDB distant (atldb01p)
zabbix_db_host: "10.30.0.10"
# Port d'écoute du frontend web (nginx). En mode TLS il reste lié à la boucle
# locale (API JSON-RPC interne) ; l'accès réseau passe par le port TLS.
zabbix_frontend_port: 8080

# ─── TLS du frontend (HTTPS obligatoire — CLAUDE.md) ───
# Le mot de passe Admin ne doit pas transiter en clair (login web, Grafana).
zabbix_frontend_tls_enabled: true
# Port HTTPS exposé au réseau pour le frontend web.
zabbix_frontend_tls_port: 8443
# Répertoire des certificats internes (hors VCS, générés sur l'hôte).
zabbix_frontend_tls_dir: "/etc/nginx/ssl"

# ─── Compte de service Grafana (lecture seule) ───
# Compte Zabbix dédié à Grafana, à moindre privilège (rôle natif « User role »),
# créé via l'API à la place du super-admin « Admin ». Son mot de passe est porté
# par le vault (vault_zabbix_grafana_password, hors VCS).
zabbix_grafana_username: "grafana"
# Groupe d'utilisateurs Zabbix portant les droits en lecture seule sur Atlas.
zabbix_grafana_usergroup: "Grafana RO"

# ─── Réduction du bruit du template « Zabbix server health » ───
# Ces compteurs internes surveillent des sous-systèmes désactivés par défaut
# (IPMI, Java, VMware, SNMP traps, rapports PDF, connecteurs). Sur une infra
# qui ne les utilise pas, ils tombent en « not supported » et polluent le
# tableau de bord sans valeur. On les désactive via l'API (idempotent).
# Mettre à [] pour conserver le comportement natif de Zabbix.
zabbix_health_template: "Zabbix server health"
zabbix_health_disabled_items:
  - "zabbix[connector_queue]"
  - "zabbix[process,connector manager,avg,busy]"
  - "zabbix[process,connector worker,avg,busy]"
  - "zabbix[process,ipmi manager,avg,busy]"
  - "zabbix[process,ipmi poller,avg,busy]"
  - "zabbix[process,java poller,avg,busy]"
  - "zabbix[process,report manager,avg,busy]"
  - "zabbix[process,report writer,avg,busy]"
  - "zabbix[process,snmp trapper,avg,busy]"
  - "zabbix[process,vmware collector,avg,busy]"
  - "zabbix[vmware,buffer,pused]"

# ─── Débogage ───

zabbix_debug: false

# ─── Hôtes supervisés (enregistrés automatiquement via l'API) ───

# Point d'entrée de l'API JSON-RPC (exécuté en local sur atlzbx01p)
zabbix_api_url: "http://localhost:8080/api_jsonrpc.php"
# Conteneurs Atlas à enregistrer dans Zabbix (agent2 sur le port 10050)
zabbix_monitored_hosts:
  - { name: atlbst01p, ip: 10.90.0.10 }
  - { name: atlrp01p, ip: 10.20.0.10 }
  - { name: atlapp01p, ip: 10.20.0.11 }
  - { name: atldb01p, ip: 10.30.0.10 }
  - { name: atlsmtp01p, ip: 10.30.0.11 }
  - { name: atlzbx01p, ip: 10.30.0.12 }
  - { name: atlbkp01p, ip: 10.30.0.13 }
  - { name: atlgrf01p, ip: 10.30.0.14 }
  - { name: atltst01p, ip: 10.20.0.20 }
