---
# ══════════════════════════════════════════════
# Rôle : zabbix — réduction du bruit « Zabbix server health »
# ══════════════════════════════════════════════
# Désactive, via l'API, les items internes surveillant des sous-systèmes
# désactivés par défaut (IPMI, Java, VMware, SNMP traps, rapports,
# connecteurs). Sans cela ils restent en « not supported » et polluent le
# tableau de bord. Idempotent : item.update ne change rien si déjà désactivé.
# Piloté par zabbix_health_disabled_items (mettre [] pour ne rien toucher).

- name: "Ne rien faire si aucun item de santé n'est à désactiver"
  ansible.builtin.meta: end_play
  when: zabbix_health_disabled_items | length == 0

# ─── Ouverture de session ───
- name: "Ouvrir une session API Zabbix (tune_health)"
  ansible.builtin.uri:
    url: "{{ zabbix_api_url }}"
    method: POST
    body_format: json
    body:
      jsonrpc: "2.0"
      method: user.login
      params:
        username: Admin
        password: "{{ vault_zabbix_admin_password }}"
      id: 1
    status_code: 200
  register: zabbix_health_login
  failed_when: zabbix_health_login.json.result is not defined
  changed_when: false
  no_log: true

# ─── Récupération des items internes sur le template ───
- name: "Récupérer les items de santé à désactiver sur le template"
  ansible.builtin.uri:
    url: "{{ zabbix_api_url }}"
    method: POST
    headers:
      Authorization: "Bearer {{ zabbix_health_login.json.result }}"
    body_format: json
    body:
      jsonrpc: "2.0"
      method: item.get
      params:
        output: ["itemid", "key_", "status"]
        templated: true
        host: "{{ zabbix_health_template }}"
        filter:
          key_: "{{ zabbix_health_disabled_items }}"
      id: 2
    status_code: 200
  register: zabbix_health_items
  failed_when: zabbix_health_items.json.result is not defined
  changed_when: false
  no_log: true

# ─── Désactivation (status=1) — uniquement les items encore actifs ───
# On ne cible que les items dont status == "0" pour rester idempotent et ne
# marquer « changed » que lorsqu'une désactivation a réellement lieu.
- name: "Désactiver les items internes non utilisés (idempotent)"
  ansible.builtin.uri:
    url: "{{ zabbix_api_url }}"
    method: POST
    headers:
      Authorization: "Bearer {{ zabbix_health_login.json.result }}"
    body_format: json
    body:
      jsonrpc: "2.0"
      method: item.update
      params:
        itemid: "{{ item.itemid }}"
        status: 1
      id: 3
    status_code: 200
  register: zabbix_health_update
  failed_when: zabbix_health_update.json.result is not defined
  changed_when: true
  no_log: true
  loop: "{{ zabbix_health_items.json.result | selectattr('status', 'equalto', '0') | list }}"
  loop_control:
    label: "{{ item.key_ }}"

# ─── Fermeture de session ───
- name: "Fermer la session API Zabbix (tune_health)"
  ansible.builtin.uri:
    url: "{{ zabbix_api_url }}"
    method: POST
    headers:
      Authorization: "Bearer {{ zabbix_health_login.json.result }}"
    body_format: json
    body:
      jsonrpc: "2.0"
      method: user.logout
      params: []
      id: 4
    status_code: 200
  changed_when: false
  failed_when: false
  no_log: true

- name: "Résumé de la réduction du bruit de santé Zabbix"
  ansible.builtin.debug:
    msg: >-
      Items de santé désactivés cette exécution :
      {{ zabbix_health_update.results | default([]) | selectattr('item', 'defined')
         | map(attribute='item.key_') | list | join(', ') | default('aucun (déjà conforme)', true) }}
  when: zabbix_debug
