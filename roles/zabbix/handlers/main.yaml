---
# ══════════════════════════════════════════════
# Rôle : zabbix — handlers
# ══════════════════════════════════════════════

# ─── Services serveur et frontend ───

- name: Redémarrer zabbix-server
  ansible.builtin.systemd_service:
    name: zabbix-server
    state: restarted

- name: Recharger nginx (zabbix)
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded

- name: Redémarrer php-fpm (zabbix)
  ansible.builtin.systemd_service:
    name: php8.2-fpm
    state: restarted
