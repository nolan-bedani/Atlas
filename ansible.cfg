# ══════════════════════════════════════════════════════════════════════
# ansible.cfg — Projet Atlas PRA/DR
# Control node : pve01 (138.201.135.108)
#
# ⚠️  REPRISE DU CONTROL NODE (PRA) : ce fichier suppose une exécution depuis
#     pve01 (clé /root/.ssh/atlas_ed25519, rebond bastion en /root/.ssh dans
#     develop/hosts.yaml). Si pve01 est lui-même l'hôte sinistré, Ansible doit
#     pouvoir tourner depuis un control node de secours :
#       - copier la clé privée atlas_ed25519 + .vault_pass sur le nœud de
#         secours (coffre hors site), puis surcharger le chemin de clé sans
#         éditer ce fichier :
#           ansible-playbook ... -e ansible_ssh_private_key_file=<chemin_local>
#         (ou exporter ANSIBLE_PRIVATE_KEY_FILE / ANSIBLE_REMOTE_USER) ;
#       - si le rebond bastion (10.90.0.10) est indisponible, adapter le
#         ProxyCommand de l'inventaire ou cibler les hôtes en direct.
#     Tester périodiquement cette bascule pour garantir le RTO <= 40 min.
# ══════════════════════════════════════════════════════════════════════
[defaults]
inventory           = develop/hosts.yaml
roles_path          = roles
vault_password_file = .vault_pass
remote_user         = atlsvc
private_key_file    = /root/.ssh/atlas_ed25519
# Vérification des clés d'hôte déléguée à SSH en mode accept-new (cf. ssh_args) :
# confiance au 1er contact mais détection d'un changement de clé (MITM).
host_key_checking   = True
stdout_callback     = yaml
gathering           = smart
fact_caching        = jsonfile
fact_caching_connection = .cache/facts
fact_caching_timeout    = 3600
collections_paths   = ~/.ansible/collections:/usr/share/ansible/collections

[ssh_connection]
ssh_args            = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
pipelining          = True
