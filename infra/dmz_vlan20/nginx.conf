# =============================================================================
# ⚠️  OBSOLÈTE — configuration statique doublon du template du rôle Ansible
# `reverse_proxy` (roles/reverse_proxy/templates/). LA source de vérité est le
# rôle. Conservé comme référence ; ne pas déployer en parallèle (divergence).
# =============================================================================
# Projet Atlas — Nginx Reverse Proxy Configuration
# Zone: DMZ (VLAN 20 — 10.20.0.0/24)
# Upstream backend: LAN_ADMIN (VLAN 30 — 10.30.0.10:80)
# =============================================================================
# Security posture:
#   - TLS 1.2/1.3 only; SSLv3, TLS 1.0, TLS 1.1 are disabled.
#   - Server version token hidden (server_tokens off).
#   - Rate limiting: 30 requests/minute per source IP, burst 10.
#   - HSTS enforced with a 1-year max-age.
#   - Standard hardening headers applied on every HTTPS response.
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -------------------------------------------------------------------------
    # Hide Nginx version from response headers and error pages (hardening).
    # -------------------------------------------------------------------------
    server_tokens off;

    # -------------------------------------------------------------------------
    # Rate limiting — protect the GLPI application from brute-force and DoS.
    # Zone "glpi_limit": tracks source IPs ($binary_remote_addr), 10 MB state
    # table (≈ 160 000 IP entries), maximum sustained rate of 30 req/min.
    # Applied on location / with burst=10 nodelay.
    # -------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=glpi_limit:10m rate=30r/m;

    # -------------------------------------------------------------------------
    # Log format — includes X-Forwarded-For to preserve real client IP when
    # traffic arrives through an upstream load-balancer or CDN.
    # -------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'fwd="$http_x_forwarded_for"';

    sendfile on;
    keepalive_timeout 65;

    # =========================================================================
    # Server block 1 — Plain HTTP (port 80)
    # All requests are permanently redirected to HTTPS. No content is served
    # over unencrypted HTTP.
    # =========================================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;

        server_name _;

        access_log /var/log/nginx/access.log main;
        error_log  /var/log/nginx/error.log warn;

        # 301 permanent redirect — preserves the original path and query string.
        return 301 https://$host$request_uri;
    }

    # =========================================================================
    # Server block 2 — HTTPS (port 443) — TLS termination & reverse proxy
    # =========================================================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        # IMPORTANT: server_name must exactly match the Common Name (CN) or a
        # Subject Alternative Name (SAN) in the provisioned TLS certificate.
        # Adjust if the actual FQDN differs.
        server_name helpdesk.atlas.internal;

        access_log /var/log/nginx/access.log main;
        error_log  /var/log/nginx/error.log warn;

        # ---------------------------------------------------------------------
        # TLS configuration
        # Certificates are provisioned outside VCS and mounted via Docker volume
        # at ./certs (see docker-compose.yml). Refer to the Runbook for cert
        # provisioning steps (Let's Encrypt / internal PKI).
        # ---------------------------------------------------------------------
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Only TLS 1.2 and 1.3 — SSLv3, TLS 1.0, and TLS 1.1 are forbidden.
        ssl_protocols TLSv1.2 TLSv1.3;

        # Strong cipher suites — AEAD ciphers with forward secrecy only.
        # ECDHE key exchange ensures PFS; AES-256-GCM and ChaCha20-Poly1305
        # provide authenticated encryption.
        ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers on;

        # DH parameters — generate with:
        #   openssl dhparam -out ./certs/dhparam.pem 4096
        # Uncomment once the file is provisioned.
        # ssl_dhparam /etc/nginx/certs/dhparam.pem;

        # TLS session cache — improves performance for returning clients.
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ---------------------------------------------------------------------
        # Security response headers
        # ---------------------------------------------------------------------

        # HSTS — instruct browsers to use HTTPS exclusively for 1 year.
        # includeSubDomains protects all subdomains of atlas.internal.
        # NOTE: Do NOT enable preload until the full domain is tested and stable.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Prevent this site from being embedded in iframes on other origins.
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Prevent MIME-type sniffing — browsers must honour Content-Type.
        add_header X-Content-Type-Options "nosniff" always;

        # Send the origin when navigating to HTTPS, omit it for cross-origin
        # downgrades.
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # ---------------------------------------------------------------------
        # Health endpoint — used by Docker healthcheck and Zabbix HTTP checks.
        # Returns HTTP 200 with body "OK". Not proxied to the backend.
        # ---------------------------------------------------------------------
        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK\n";
        }

        # ---------------------------------------------------------------------
        # Main proxy block — forward all other traffic to the GLPI backend.
        #
        # Upstream: http://10.30.0.10:80
        # Network : LAN_ADMIN (VLAN 30 — 10.30.0.0/24)
        # IMPORTANT: Adjust the IP/port to match the actual GLPI server address
        # in the LAN_ADMIN segment. This should be managed via an Ansible
        # variable (e.g., glpi_backend_ip) — do not hardcode in production.
        # ---------------------------------------------------------------------
        location / {
            # Apply rate limit defined above — 30 req/min per source IP,
            # burst of 10 requests handled immediately without delay.
            limit_req zone=glpi_limit burst=10 nodelay;

            proxy_pass http://10.30.0.10:80;

            # Pass the original Host header so GLPI generates correct URLs.
            proxy_set_header Host              $host;

            # Real client IP — used by GLPI for audit logs and access rules.
            proxy_set_header X-Real-IP         $remote_addr;

            # Full forwarding chain — preserves intermediate proxy IPs.
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

            # Tell the backend that the original request was HTTPS.
            proxy_set_header X-Forwarded-Proto $scheme;

            # Proxy timeouts — adjust to GLPI response time requirements.
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            # Buffer tuning for typical GLPI HTML pages.
            proxy_buffer_size          16k;
            proxy_buffers              4 32k;
            proxy_busy_buffers_size    64k;
        }
    }
}
